payment:
  mpesa:
    success-rate: 0.9
    delay-ms: 2000

resilience4j:
  circuitbreaker:
    instances:
      paymentGatewayCb:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
  retry:
    instances:
      paymentGatewayCb:
        maxAttempts: 3
        waitDuration: 1s
  timelimiter:
    instances:
      paymentGatewayCb:
        timeoutDuration: 5s

